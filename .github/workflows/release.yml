---
name: release

# Publishing is driven by the tag, so the tag is the release. Nothing publishes
# from a branch.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: build and publish to Ansible Galaxy
    runs-on: ubuntu-latest

    # Needed to create the GitHub release and upload the tarball. The default
    # GITHUB_TOKEN is read-only on repositories configured that way.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: pip install --disable-pip-version-check ansible-core

      # The guard that makes this worth having. Galaxy takes its version from
      # galaxy.yml and ignores the tag entirely, so a mismatch publishes the
      # wrong version under the right tag and cannot be undone - Galaxy does not
      # allow re-uploading a version. Fail before building instead.
      - name: Assert the tag matches galaxy.yml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^version:[[:space:]]*//p' galaxy.yml | head -1)"
          echo "tag=${tag} galaxy.yml=${declared}"
          if [ "${tag}" != "${declared}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match galaxy.yml version ${declared}."
            echo "::error::Bump galaxy.yml and re-tag, or tag v${declared}."
            exit 1
          fi

      # A release that ships a failing test is worse than a late release.

      # Galaxy does not allow re-uploading a version, so a collision is not a
      # warning, it is an unusable tag. This exact thing happened: 1.5.0 was
      # published on 2026-02-04 from a working tree whose galaxy.yml bump was
      # never committed, so the repository claimed 1.4.0 for seven months while
      # Galaxy served 1.5.0. Check before building, not after.
      - name: Refuse to publish a version Galaxy already holds
        run: |
          declared="$(sed -n 's/^version:[[:space:]]*//p' galaxy.yml | head -1)"
          url="https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/index/aursu/general/versions/${declared}/"
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url")"
          echo "Galaxy says HTTP ${code} for aursu.general ${declared}"
          case "${code}" in
            200)
              echo "::error::aursu.general ${declared} is already published on Galaxy."
              echo "::error::Galaxy will not accept it again. Bump galaxy.yml and re-tag."
              exit 1
              ;;
            404) echo "Version is free." ;;
            # Anything else is Galaxy being unreachable or unhappy, which is not
            # evidence the version is taken. Say so and continue; the publish
            # step will fail loudly enough if it is.
            *) echo "::warning::Could not confirm (HTTP ${code}); continuing." ;;
          esac
      - name: Install pytest
        run: pip install --disable-pip-version-check pytest

      - name: Unit tests
        env:
          PYTHONPATH: ${{ runner.temp }}/collections
        run: |
          mkdir -p "${RUNNER_TEMP}/collections/ansible_collections/aursu"
          ln -s "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/collections/ansible_collections/aursu/general"
          python -m pytest tests/unit -q

      - name: Build
        run: ansible-galaxy collection build --output-path dist/

      - name: Publish
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          if [ -z "${GALAXY_API_KEY}" ]; then
            echo "::error::GALAXY_API_KEY is not set on this repository."
            exit 1
          fi
          # --api-key must be passed explicitly; ~/.ansible/galaxy_token alone
          # yields HTTP 401 "Authentication credentials were not provided".
          ansible-galaxy collection publish dist/*.tar.gz --api-key "${GALAXY_API_KEY}"

      - name: Attach the tarball to the GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'dist';
            const file = fs.readdirSync(dir).find(f => f.endsWith('.tar.gz'));
            if (!file) { core.setFailed('no tarball built'); return; }
            const tag = context.ref.replace('refs/tags/', '');
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: 'Published to Ansible Galaxy. See CHANGELOG.md.',
            });
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: file,
              data: fs.readFileSync(path.join(dir, file)),
            });
